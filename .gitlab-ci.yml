stages:
    - test
    - deploy

unit-test-job:
    stage: test
    image: oven/bun:1
    tags:
      - shared-fi
    script:
      - bun install
      - bun test apps/server/tests/schemas apps/server/tests/utils/audit.test.ts apps/server/tests/utils/logger.test.ts apps/server/tests/utils/storage.test.ts

deploy-job:
    stage: deploy
    image: oven/bun:1
    tags:
      - shared-fi
    only:
      - feature/production
    before_script:
      - apt-get update -qq && apt-get install -y -qq curl
      - curl -fsSL https://raw.githubusercontent.com/railwayapp/cli/master/install.sh | sh
    script:
      - railway up --service server --detach
      - railway up --service web --detach
    environment:
      name: production