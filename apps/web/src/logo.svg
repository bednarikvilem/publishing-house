<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#1a1a1a"/>

  <!-- Main newspaper body -->
  <rect x="10" y="12" width="44" height="40" rx="4" fill="white"/>

  <!-- Left spine -->
  <rect x="10" y="12" width="9" height="40" rx="4" fill="#d1d5db"/>
  <rect x="15" y="12" width="4" height="40" fill="#d1d5db"/>

  <!-- Headline bar -->
  <rect x="22" y="17" width="26" height="7" rx="2" fill="#1a1a1a"/>

  <!-- Content lines -->
  <rect x="22" y="28" width="18" height="3" rx="1.5" fill="#9ca3af"/>
  <rect x="22" y="33" width="22" height="3" rx="1.5" fill="#9ca3af"/>
  <rect x="22" y="38" width="14" height="3" rx="1.5" fill="#9ca3af"/>

  <!-- Image placeholder -->
  <rect x="22" y="44" width="12" height="6" rx="2" fill="#e5e7eb"/>
</svg>
